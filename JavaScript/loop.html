<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Printer</title>
</head>
<body>
    <fieldset>
        <input type="text" id="num1" placeholder="Enter number">
        <input type="button" value="Submit" onclick="tableprint()">
        <div id="result"></div>
    </fieldset>

    <script>
        function tableprint() {
            let num1 = parseInt(document.getElementById('num1').value);
            let str = "";

            for (let i = 1; i <= 10; i++) {
                str += `${num1} * ${i} = ${num1 * i}<br>`;
            }

            document.getElementById('result').innerHTML = str;
        }
    </script>
</body>
</html>
